# =====================================================================
#  CD avec Docker — après une CI réussie sur « main » :
#   1. construit l'image Docker de l'application,
#   2. l'envoie dans le registre privé GitHub (ghcr.io),
#   3. se connecte au serveur AWS en SSH et lance la nouvelle version.
#  Actif seulement si la variable du dépôt DEPLOY_MODE vaut « docker ».
#  Secrets nécessaires : EC2_HOST, EC2_USER, EC2_SSH_KEY
# =====================================================================
name: Déploiement Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Construire l'image
    if: vars.DEPLOY_MODE == 'docker' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.nom.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Nom de l'image (en minuscules)
        id: nom
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "base=ghcr.io/$REPO" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$REPO:${SHA_COMPLET::7}" >> "$GITHUB_OUTPUT"
        env:
          SHA_COMPLET: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et envoyer l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.nom.outputs.image }}
            ${{ steps.nom.outputs.base }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer sur AWS
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/aws.pem
          chmod 600 ~/.ssh/aws.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Envoyer les fichiers de déploiement
        env:
          CIBLE: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/aws.pem"
          $SSH "$CIBLE" 'mkdir -p ~/bab-al-fkamah/database'
          scp -i ~/.ssh/aws.pem deploy/docker/docker-compose.prod.yml deploy/docker/installer-serveur.sh \
              deploy/docker/deployer.sh deploy/Caddyfile "$CIBLE":~/bab-al-fkamah/
          scp -i ~/.ssh/aws.pem database/schema.sql database/seed.sql "$CIBLE":~/bab-al-fkamah/database/

      - name: Lancer la nouvelle version
        env:
          CIBLE: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/aws.pem "$CIBLE" \
            "bash ~/bab-al-fkamah/deployer.sh '${{ needs.image.outputs.image }}' '${{ secrets.EC2_HOST }}' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}'"

      - name: Vérifier depuis Internet (HTTPS)
        run: |
          URL="https://$(echo '${{ secrets.EC2_HOST }}' | tr . -).sslip.io"
          for i in $(seq 1 30); do
            curl -fsS "$URL/api/sante" && { echo; echo "✅ $URL"; exit 0; }
            sleep 5
          done
          echo "❌ $URL ne répond pas (port 443 ouvert dans le groupe de sécurité AWS ?)"; exit 1
